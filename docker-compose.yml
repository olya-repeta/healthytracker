version: '3.9'

services:
  backend:
    build:
      context: .
      target: backend-production
    container_name: medtracker-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=production
      - DATABASE_URL=file:./data/prod.db
      - JWT_SECRET=${JWT_SECRET:-super-secret-wellness-jwt-key}
      - JWT_EXPIRES_IN=7d
    volumes:
      - sqlite_data:/app/backend/prisma/data

  frontend:
    build:
      context: .
      target: frontend-production
      args:
        - VITE_API_URL=http://localhost:4000/api
    container_name: medtracker-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  sqlite_data:
